name: Notify from dev

permissions:
  contents: read

on:
  push:
    branches:
      - dev

concurrency:
  group: notify-from-dev
  cancel-in-progress: true

jobs:
  notify-ha:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.AR_APP_ID }}
          private-key: ${{ secrets.AR_APP_KEY }}
          repositories: ha-asusrouter

      - name: Notify ha-asusrouter
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ steps.app_token.outputs.token }}
          repository: Vaskivskyi/ha-asusrouter
          event-type: ar_dev_push
          client-payload: |
            {"repo":"${{ github.repository }}","ref":"${{ github.ref }}","sha":"${{ github.sha }}"}
