name: CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**/*.py"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Preparation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up UV and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --all-groups

  ruff-format:
    name: Ruff Format
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up UV and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --all-groups

      - name: Run Ruff Format
        run: uv run prek run ruff-format --all-files --show-diff-on-failure

  ruff-check:
    name: Ruff Check
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up UV and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --all-groups

      - name: Run Ruff Check
        run: uv run prek run ruff-check --all-files --show-diff-on-failure

  mypy:
    name: Mypy
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up UV and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --all-groups

      - name: Run Mypy
        run: uv run prek run mypy --all-files

  unit-tests:
    name: Unit Tests
    needs:
      - ruff-format
      - ruff-check
      - mypy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up UV and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --all-groups

      - name: Run unit tests
        run: |
          uv run pytest --cov=asusrouter --cov-report=xml:unit-tests-cov-${{ matrix.python-version }}.xml

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-cov-${{ matrix.python-version }}
          path: unit-tests-cov-${{ matrix.python-version }}.xml

  codecov:
    name: Codecov
    needs: [unit-tests]
    runs-on: ubuntu-latest

    if: ${{ github.actor != 'dependabot[bot]' }}

    permissions:
      contents: read
      checks: write

    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download unit-tests coverage from artifacts
        uses: actions/download-artifact@v8
        with:
          name: unit-tests-cov-${{ matrix.python-version }}
          path: .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: unit-tests-cov-${{ matrix.python-version }}.xml
