# This workflow is partially AI-generated
name: Sync ruff version

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [dev]
    paths:
      - ".github/workflows/sync-ruff.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/sync-ruff.yml"

concurrency:
  group: sync-ruff
  cancel-in-progress: true

jobs:
  sync-ruff:
    name: Sync ruff version
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.AR_APP_ID }}
          private-key: ${{ secrets.AR_APP_KEY }}

      - name: Resolve dependabot ruff PR
        id: dep_pr
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ] && \
             [ "${{ github.actor }}" = "dependabot[bot]" ] && \
             echo "$PR_TITLE" | grep -qi "ruff"; then
            NUMBER="$PR_NUMBER"
            HEAD_REF="$PR_HEAD_REF"
          else
            JSON=$(gh pr list \
              --repo "${{ github.repository }}" \
              --author "dependabot[bot]" \
              --base dev \
              --json number,headRefName,title \
              --jq '[.[] | select(.title | contains("ruff"))] | .[0] // empty')
            if [ -z "$JSON" ]; then
              echo "No open dependabot ruff PR — skipping"
              exit 0
            fi
            NUMBER=$(echo "$JSON" | jq -r '.number')
            HEAD_REF=$(echo "$JSON" | jq -r '.headRefName')
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Extract ruff version
        if: steps.dep_pr.outputs.number != ''
        id: ruff
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HEAD_REF: ${{ steps.dep_pr.outputs.head_ref }}
        run: |
          VERSION=$(gh api "repos/${{ github.repository }}/contents/uv.lock?ref=$HEAD_REF" \
            --jq '.content' | base64 -d | grep -A1 '^name = "ruff"$' | grep -oP 'version = "\K[^"]+')
          if [ -z "$VERSION" ]; then
            echo "::error::ruff not found in uv.lock"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=bot/bump-ruff-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing bot PR
        if: steps.dep_pr.outputs.number != ''
        id: existing
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          URL=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ steps.ruff.outputs.branch }}" \
            --json url \
            --jq '.[0].url // ""')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Checkout dev
        if: >
          steps.dep_pr.outputs.number != '' &&
          steps.existing.outputs.url == '' &&
          github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: dev
          token: ${{ steps.app_token.outputs.token }}

      - name: Set up uv
        if: >
          steps.dep_pr.outputs.number != '' &&
          steps.existing.outputs.url == '' &&
          github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Patch version pins and regenerate lock
        if: >
          steps.dep_pr.outputs.number != '' &&
          steps.existing.outputs.url == '' &&
          github.event_name != 'pull_request'
        run: |
          V="${{ steps.ruff.outputs.version }}"
          sed -i 's/"ruff==[^"]*"/"ruff=='"$V"'"/' pyproject.toml
          sed -i '\|astral-sh/ruff-pre-commit|{n; s/rev: .*/rev: v'"$V"'/}' .pre-commit-config.yaml
          uv lock --upgrade-package ruff

      - name: Commit and push
        if: >
          steps.dep_pr.outputs.number != '' &&
          steps.existing.outputs.url == '' &&
          github.event_name != 'pull_request'
        run: |
          git config user.name "asusrouter-bot[bot]"
          git config user.email "asusrouter-bot[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.ruff.outputs.branch }}"
          git add pyproject.toml .pre-commit-config.yaml uv.lock
          git commit -m "Bump ruff to ${{ steps.ruff.outputs.version }}"
          git push origin "${{ steps.ruff.outputs.branch }}" --force-with-lease

      - name: Create bot PR
        if: >
          steps.dep_pr.outputs.number != '' &&
          steps.existing.outputs.url == '' &&
          github.event_name != 'pull_request'
        id: create_pr
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          URL=$(gh pr create \
            --title "Bump ruff to ${{ steps.ruff.outputs.version }}" \
            --body "Bumps \`ruff\` to \`${{ steps.ruff.outputs.version }}\` in \`pyproject.toml\`, \`.pre-commit-config.yaml\`, and \`uv.lock\`." \
            --base dev \
            --head "${{ steps.ruff.outputs.branch }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Close dependabot PR
        if: >
          steps.dep_pr.outputs.number != '' &&
          github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          BOT_PR="${{ steps.create_pr.outputs.url || steps.existing.outputs.url }}"
          gh pr close "${{ steps.dep_pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --comment "Superseded by $BOT_PR which also updates \`pyproject.toml\` and \`.pre-commit-config.yaml\`." \
            || true
