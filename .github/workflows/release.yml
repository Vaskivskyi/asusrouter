name: Release

on:
  release:
    types: [published]

env:
  DEFAULT_PYTHON: 3.11

jobs:
  build:
    name: Build PyPI package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Set up UV and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --all-groups

      - name: Verify tag matches pyproject version
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          version="$(uv run python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "Release tag: $tag | pyproject version: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag ($tag) does not match pyproject version ($version)"
            exit 1
          fi

      - name: Run tests
        run: |
          uv run pytest

      - name: Build package
        run: |
          uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI 📦
    needs:
      - build
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/asusrouter

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
