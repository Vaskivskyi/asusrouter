name: Feature request
description: Request a new feature for AsusRouter
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Use this form to request a new feature for the AsusRouter library.
        For a bug report or a device compatibility report, please use the appropriate form.
  - type: textarea
    validations:
      required: true
    attributes:
      label: The idea
      description: Describe what you'd like to see and why it would be useful.
  - type: dropdown
    id: firmware_type
    attributes:
      label: Firmware dependency
      description: Does this feature depend on a specific firmware type?
      options:
        - Any
        - Stock
        - Merlin
