name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Use this form to report a bug in the AsusRouter library — something that does not work as expected.
        For a feature request or a device compatibility report, please use the appropriate form.
  - type: textarea
    id: problem
    validations:
      required: true
    attributes:
      label: The problem
      description: Describe the issue. The more detail you provide, the easier it is to reproduce and fix.
  - type: input
    id: device
    validations:
      required: true
    attributes:
      label: Device model
      placeholder: "RT-AX88U"
  - type: dropdown
    id: firmware_type
    validations:
      required: true
    attributes:
      label: Firmware type
      options:
        - Stock
        - Merlin
  - type: input
    id: firmware_version
    validations:
      required: true
    attributes:
      label: Firmware version
      placeholder: "3.0.0.4.386.x"
  - type: input
    attributes:
      label: Python version
      placeholder: "3.11.0"
