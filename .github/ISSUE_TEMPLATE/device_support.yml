name: Device compatibility report
description: Report that your device works correctly with AsusRouter
title: "[Device] "
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: >
        Use this form to report that your device works well with AsusRouter.
        For a bug report or a feature request, please use the appropriate form.
  - type: textarea
    attributes:
      label: Anything to mention?
      description: Optional — any notes about your setup or quirks worth knowing.
  - type: input
    id: device
    validations:
      required: true
    attributes:
      label: Device model
      placeholder: "RT-AX88U"
  - type: dropdown
    id: firmware_type
    validations:
      required: true
    attributes:
      label: Firmware type
      options:
        - Stock
        - Merlin
  - type: input
    id: firmware_version
    validations:
      required: true
    attributes:
      label: Firmware version
      placeholder: "3.0.0.4.386.x"
