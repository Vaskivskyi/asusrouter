[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name            = "asusrouter"
version         = "2.0.0.dev0"
license         = "Apache-2.0"
license-files   = ["LICENSE"]
requires-python = ">=3.11"
readme          = "README.md"
description     = "API wrapper for communication with ASUSWRT-powered routers using HTTP protocol"
authors         = [
    { name="Yevhenii Vaskivskyi", email="yevhenii@vaskivskyi.com" },
]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies    = [
    "aiohttp>=3.14.1",
    "urllib3>=2.7.0",
    "xmltodict>=1.0.4",
]

[project.urls]
"Homepage"      = "https://asusrouter.vaskivskyi.com/"
"Source Code"   = "https://github.com/Vaskivskyi/asusrouter"
"Bug Reports"   = "https://github.com/Vaskivskyi/asusrouter/issues"

[tool.setuptools.packages.find]
include = ["asusrouter*"]

[tool.setuptools.package-data]
"asusrouter" = ["py.typed"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pydantic==2.13.5",
    "ruff==0.16.5",
    "prek==0.5.1",
]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
src = ["asusrouter"]
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]  # don't format code within markdown files

[tool.ruff.lint]
select = [
    "A001",   # Variable {name} is shadowing a Python builtin
    "ASYNC",  # flake8-async
    "BLE",    # flake8-blind-except
    "C",      # complexity
    "D",      # docstrings
    "E",      # pycodestyle / error
    "F",      # pyflakes
    "I",      # isort
    "ICN001", # {name} should be imported as {asname}
    "INP",    # flake8-no-pep420
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # Perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-pathlib
    "PYI",    # flake8-pyi
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "UP",     # pyupgrade
    "W",      # pycodestyle / warning
]

ignore = [
    "D202",   # No blank lines allowed after function docstring (found {num_lines})
]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"asusrouter.config.ARConfigKey" = "ARConfKey"
"asusrouter.config.connection.ARConnectionConfigKey" = "ARCCKey"
"asusrouter.registry.ARCallableRegistry" = "ARCallReg"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["asusrouter"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/enums.py" = [
    "S105",    # Enum members are field-name keys, not hardcoded secrets
]
"**/support/flag.py" = [
    "S105",    # Enum members are field-name keys, not hardcoded secrets
]
"scripts/*" = [
    "BLE001",  # Do not catch blind exception: `Exception`
    "PLR2004", # Magic value used in comparison
    "S603",    # `subprocess` call: check for execution of untrusted input
    "T201",    # `print` found
]
"tests/*" = [
    "BLE001",  # Do not catch blind exception: `Exception`
    "PLR0913", # Too many arguments in function definition ({c_args} > {max_args})
    "PLR0917", # Too many positional arguments ({c_pos} > {max_pos})
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of `assert` detected
    "S104",    # Possible binding to all interfaces
    "S105",    # Possible hardcoded password assigned to: "{}"
    "S106",    # Possible hardcoded password assigned to argument: "{}"
    "S301",    # `pickle` round-trips test our own values, not foreign data
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
