codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "0...100"

  status:
    # Whole-repo status is informational only: a brand-new module legitimately
    # lowers the overall number, so it must not block the PR
    project:
      default:
        informational: true
    # New/changed code is reported but not required to be fully covered
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, components, files"
  behavior: default
  require_changes: no

# One project status per module/tool: an existing component losing coverage
# turns its status red (threshold 0 = no drop tolerated). A module added in a
# PR has no base coverage, so it is exempt until it lands and becomes the base
component_management:
  default_rules:
    statuses:
      - type: project
        threshold: 0%
  individual_components:
    - component_id: core
      name: core
      paths:
        - asusrouter/*.py
        - asusrouter/config/**
